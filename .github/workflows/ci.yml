name: CI

on:
    push:
        branches: [main]
    pull_request:

# Restrict the default token to read-only; lighthouse comment posting needs
# only the GitHub App token, not GITHUB_TOKEN write access.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: lint · typecheck · test · build
        runs-on: ubuntu-latest
        steps:
            # Actions pinned to commit SHAs (with version comment) to prevent
            # supply-chain attacks via tag retargeting. Dependabot keeps these
            # current; see .github/dependabot.yml.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test -- --reporter=verbose
            - run: npm run build

    lighthouse:
        name: lighthouse
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Run Lighthouse CI
              # Pinned exact version (not floating @0.14.x) to prevent a
              # malicious patch release executing with LHCI token in scope.
              run: npx --yes @lhci/cli@0.14.0 autorun
              env:
                  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
