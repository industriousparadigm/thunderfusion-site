name: CI

on:
    push:
        branches: [main]
    pull_request:

# Restrict the default token to read-only; lighthouse comment posting needs
# only the GitHub App token, not GITHUB_TOKEN write access.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: lint · typecheck · test · build
        runs-on: ubuntu-latest
        steps:
            # Actions pinned to commit SHAs (with version comment) to prevent
            # supply-chain attacks via tag retargeting. Dependabot keeps these
            # current; see .github/dependabot.yml.
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test -- --reporter=verbose
            - run: npm run build

    lighthouse:
        name: lighthouse
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Run Lighthouse CI
              # Pinned exact version (not floating @0.14.x) to prevent a
              # malicious patch release executing with LHCI token in scope.
              run: npx --yes @lhci/cli@0.14.0 autorun
              env:
                  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
